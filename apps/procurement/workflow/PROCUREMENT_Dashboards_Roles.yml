                  width: 130
                  align: "right"
                - field: "reorder_point"
                  title: "Точка перезаказа"
                  width: 130
                  align: "right"
                - field: "deficit_quantity"
                  title: "Дефицит"
                  width: 120
                  align: "right"
                - field: "urgency_level"
