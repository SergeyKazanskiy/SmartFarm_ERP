    # -------------------------------------------------------------------------------
    # DASH-PROC-03: Заказы и поставки (сокращенная версия)
    # -------------------------------------------------------------------------------
    - dashboard_code: DASH-PROC-03
      dashboard: "Заказы и поставки"
      layout: "three-zones"
      sections:
        - id: "sec-kpi-director-orders"
          type: "kpi"
          title: "Ключевые показатели"
          widgets:
            - widget_id: W03-05
              type: Indicator
              title: "Общая сумма активных заказов"
              subtitle: "в обработке"
              dataSource: "Q-PROC-03-05"
              field: "total_active_amount"
              aggregation: "SUM"
              format: "currency"
              currencyCode: "UAH"
              grid: { w: 4 }
              linked_operations: [OP-PROC-12]
              
            - widget_id: W03-02
              type: Indicator
              title: "Просроченные поставки"
              subtitle: "ожидаемая дата < сегодня"
              dataSource: "Q-PROC-03-02"
              field: "overdue_shipments"
              aggregation: "SUM"
              format: "number"
              conditions:
                - field: "value"
                  operator: "<="
                  value: 2
                  status: "success"
                  label: "Норма"
                - field: "value"
                  operator: ">"
                  value: 2
                  status: "danger"
                  label: "Требует внимания"
              grid: { w: 4 }
              linked_operations: [OP-PROC-12, OP-PROC-17]