          widgets:
            - widget_id: W05-04
              type: Table
              title: "Отклонения бюджета (план-факт)"
              subtitle: "анализ отклонений"
              dataSource: "Q-PM-05-04"
              pageSize: 15
              enableSearch: true
              enableExport: true
              columns:
                - field: "category"
                  title: "Категория"
                  width: 200
                  sortable: true
                - field: "total_planned"
                  title: "План"
                  width: 130
                  align: "right"
                  formatter: "currency"
                - field: "total_actual"
                  title: "Факт"
                  width: 130
                  align: "right"
                  formatter: "currency"
                - field: "variance"
                  title: "Отклонение"
                  width: 130
                  align: "right"
                  formatter: "currency"
                  color: status
              summary:
                - field: total_planned
                  label: "Итого план"
                  aggregation: SUM
                - field: total_actual
                  label: "Итого факт"
                  aggregation: SUM
                - field: variance
                  label: "Итого отклонение"
                  aggregation: SUM
              grid: { w: 6 }
              linked_operations: [OP-PM-26, OP-PM-28]