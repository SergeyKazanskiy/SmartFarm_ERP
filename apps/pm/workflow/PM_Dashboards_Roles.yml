              field: "total_budget"
              aggregation: "SUM"
              format: "currency"
              currencyCode: "UAH"
              grid: { w: 4 }
              linked_operations: [OP-PM-24]

        - id: "sec-analytics-budget-fc"
          type: "analytics"
          title: "Аналитика бюджета"
          widgets:
            - widget_id: W05-02
              type: Chart
              title: "Бюджет по проектам"
              dataSource: "Q-PM-05-02"
              chartType: "bar"
              category: "project_id"
              showGrid: true
              showLegend: true
              height: 320
              leftAxis:
                format: "currency"
                currencyCode: "UAH"
              series:
                - field: "total_planned_amount"
                  label: "План"
                  color: "#60a5fa"
