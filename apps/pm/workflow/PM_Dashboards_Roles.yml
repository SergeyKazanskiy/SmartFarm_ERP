    # -------------------------------------------------------------------------------
    # DASH-PM-05: Бюджет проекта (сокращенная версия)
    # -------------------------------------------------------------------------------
    - dashboard_code: DASH-PM-05
      dashboard: "Бюджет проекта"
      layout: "three-zones"
      sections:
        - id: "sec-kpi-budget-ceo"
          type: "kpi"
          title: "Ключевые показатели"
          widgets:
            - widget_id: W05-01
              type: Indicator
