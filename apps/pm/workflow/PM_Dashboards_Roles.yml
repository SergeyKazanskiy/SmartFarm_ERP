              dataSource: "Q-PM-05-01"
              field: "total_budget"
              aggregation: "SUM"
              format: "currency"
              currencyCode: "UAH"
              grid: { w: 4 }
              linked_operations: [OP-PM-24]


# =====================================================================================
# РОЛЬ: Финансовый контролер
# =====================================================================================
- role: "financial_controller"
  dashboards:
    # -------------------------------------------------------------------------------
    # DASH-PM-05: Бюджет проекта (расширенная версия)
    # -------------------------------------------------------------------------------
    - dashboard_code: DASH-PM-05
      dashboard: "Бюджет проекта"
      layout: "three-zones"
      sections:
        - id: "sec-kpi-budget-fc"
          type: "kpi"
          title: "Ключевые показатели"
          widgets:
            - widget_id: W05-01
              type: Indicator
              title: "Общий бюджет"
