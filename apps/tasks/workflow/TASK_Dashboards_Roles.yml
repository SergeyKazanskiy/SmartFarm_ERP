                - field: "planned_finish"
                  title: "Финиш"
                  width: 120
                  formatter: "datetime"
                - field: "assigned_to"
                  title: "Исполнитель"
                  width: 100
                  align: "center"
                - field: "completion_percent"
                  title: "Выполнение (%)"
                  width: 100
                  widget:
                    type: "progress"
                    max: 100
              grid: { w: 12 }
              linked_operations: [OP-TASK-01, OP-TASK-02, OP-TASK-03]