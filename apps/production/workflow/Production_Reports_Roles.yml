            - { field: planned_quantity, label: "План (шт)", type: number, format: decimal }
            - { field: actual_quantity, label: "Факт (шт)", type: number, format: decimal }
            - { field: variance_quantity, label: "Отклонение (шт)", type: number, format: decimal, color: status }
            - { field: unit_cost, label: "Цена за ед.", type: number, format: currency }
            - { field: planned_cost, label: "План (грн)", type: number, format: currency }
            - { field: actual_cost, label: "Факт (грн)", type: number, format: currency }
            - { field: variance_cost, label: "Отклонение (грн)", type: number, format: currency, color: status }
      summary:
        - field: planned_cost
          label: "Итого план"
          aggregation: SUM
        - field: actual_cost
          label: "Итого факт"
          aggregation: SUM
        - field: variance_cost
          label: "Итого отклонение"
          aggregation: SUM
      query_ref: Q-PROD-R05
      linked_operations:
        - OP-PROD-17  # Списание материалов по норме
        - OP-PROD-18  # Фактическое списание материалов
        - OP-PROD-34  # Корректировка фактического расхода
      export:
        formats: [pdf, excel, print]
        template: "material_consumption_order"


# =====================================================================================
# РОЛЬ: Технолог
# =====================================================================================
- role: "технолог"
  reports:
    # -------------------------------------------------------------------------------
    # REP-PROD-02: Маршрутный лист заказа
    # -------------------------------------------------------------------------------
    - report_code: REP-PROD-02
      report: "Маршрутный лист заказа"
      description: >
        Полная технологическая карта заказа: последовательность операций, ресурсы,
        целевые параметры, признак контроля качества.
        Используется для планирования производства и контроля соблюдения технологии.
      parameters:
        - name: production_order_id
          label: "ID производственного заказа"
          type: number
          required: true
          description: "Введите ID производственного заказа"
      sections:
        - title: "Маршрутный лист"
          columns:
            - { field: sequence_no, label: "№", type: number, format: integer }
            - { field: operation_name, label: "Операция", type: string }
            - { field: work_center_name, label: "Рабочий центр", type: string }
            - { field: resources_json, label: "Ресурсы", type: string }
            - { field: parameters_json, label: "Параметры", type: string }
            - { field: has_quality_control, label: "Контроль качества", type: boolean }
      query_ref: Q-PROD-R02
      linked_operations:
        - OP-PROD-07  # Создание операции
        - OP-PROD-09  # Добавление ресурсов
        - OP-PROD-10  # Добавление параметров
        - OP-PROD-11  # Назначение рабочего центра
        - OP-PROD-13  # Добавление контроля качества
      export:
        formats: [pdf, print]
        template: "routing_sheet"

    # -------------------------------------------------------------------------------
    # REP-PROD-03: Акт о браке
    # -------------------------------------------------------------------------------
    - report_code: REP-PROD-03
      report: "Акт о браке"
      description: >
        Реестр всех операций, не прошедших контроль качества за период.
        Показывает причину брака, исполнителя и время выполнения.
      parameters:
        - name: period_from
          label: "Период с"
          type: date
          required: true
          description: "Начало периода"
        - name: period_to
          label: "Период по"
          type: date
          required: true
          description: "Конец периода"
      sections:
        - title: "Акт о браке"
          columns:
            - { field: execution_id, label: "ID выполнения", type: number, format: integer }
            - { field: operation_name, label: "Операция", type: string }
            - { field: work_center_name, label: "Рабочий центр", type: string }
            - { field: performed_by_employee_id, label: "Исполнитель", type: number, format: integer }
            - { field: quality_point_id, label: "ID точки контроля", type: string }
            - { field: quality_point_name, label: "Точка контроля", type: string }
            - { field: comment, label: "Причина брака", type: string }
            - { field: end_time, label: "Время", type: datetime }
      query_ref: Q-PROD-R03
      linked_operations:
        - OP-PROD-39  # Контроль качества
      export:
        formats: [pdf, excel, print]
        template: "defect_report"

    # -------------------------------------------------------------------------------
    # REP-PROD-06: Спецификация изделия (BOM)
    # -------------------------------------------------------------------------------
    - report_code: REP-PROD-06
      report: "Спецификация изделия (BOM)"
      description: >
        Печатная форма состава изделия с нормами расхода и плановой стоимостью.
        Используется для расчета себестоимости и планирования закупок.
      parameters:
        - name: bom_id
          label: "ID спецификации"
          type: number
          required: true
          description: "Введите ID спецификации"
      sections:
        - title: "Спецификация изделия"
          columns:
            - { field: material_id, label: "ID материала", type: number, format: integer }
            - { field: quantity, label: "Количество", type: number, format: decimal }
            - { field: unit_cost, label: "Цена за ед.", type: number, format: currency }
            - { field: line_cost, label: "Сумма", type: number, format: currency }
      summary:
        - field: line_cost
          label: "Итого по спецификации"
          aggregation: SUM
      query_ref: Q-PROD-R06
      linked_operations:
        - OP-PROD-15  # Создание BOM
        - OP-PROD-17  # Добавление позиции BOM
        - OP-PROD-18  # Изменение позиции BOM
        - OP-PROD-19  # Удаление позиции BOM
      export:
        formats: [pdf, print]
        template: "bom_specification"

    # -------------------------------------------------------------------------------
    # REP-PROD-07: Отчёт по отклонениям технологических параметров
    # -------------------------------------------------------------------------------
    - report_code: REP-PROD-07
      report: "Отчёт по отклонениям технологических параметров"
      description: >
        Все фактические измерения, вышедшие за допуск целевого параметра операции.
        Используется для контроля соблюдения технологии и анализа качества.
      parameters:
        - name: period_from
          label: "Период с"
          type: date
          required: true
          description: "Начало периода"
        - name: period_to
          label: "Период по"
          type: date
          required: true
          description: "Конец периода"
