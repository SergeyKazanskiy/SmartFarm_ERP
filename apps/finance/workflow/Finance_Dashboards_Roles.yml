# =====================================================================================
# Finance — дашборды по ролям (с полной конфигурацией виджетов)
# Версия: 2.0
# Построен на Finance_Schema.json версии 1.2 (14 таблиц)
# =====================================================================================

- role: "бухгалтер"
  dashboards:
    # -------------------------------------------------------------------------------
    # DASH-FIN-02: Дебиторская и кредиторская задолженность
    # -------------------------------------------------------------------------------
    - dashboard_code: DASH-FIN-02
      dashboard: "Дебиторская и кредиторская задолженность"
      layout: "three-zones"
      sections:
        - id: "sec-kpi-arap"
          type: "kpi"
          title: "Ключевые показатели задолженности"
          widgets:
            - widget_id: W02-01
              type: Indicator
              title: "Дебиторская задолженность (AR)"
              subtitle: "непогашенные счета к получению"
              dataSource: "Q-FIN-02-01"
              field: "total_ar_outstanding"
              aggregation: "SUM"
              format: "currency"
              currencyCode: "UAH"
              conditions:
                - field: "value"
                  operator: "<="
                  value: 1000000
                  status: "success"
                  label: "Норма"
                - field: "value"
                  operator: ">"
                  value: 1000000
                  status: "warning"
                  label: "Требует внимания"
              grid: { w: 4 }
              linked_operations: [OP-FIN-11, OP-FIN-13]
              
            - widget_id: W02-02
              type: Indicator
              title: "Кредиторская задолженность (AP)"
              subtitle: "непогашенные счета к оплате"
              dataSource: "Q-FIN-02-02"
              field: "total_ap_outstanding"
              aggregation: "SUM"
              format: "currency"
              currencyCode: "UAH"
              conditions:
                - field: "value"
                  operator: "<="
                  value: 2000000
                  status: "success"
                  label: "Норма"
                - field: "value"
                  operator: ">"
                  value: 2000000
                  status: "warning"
                  label: "Требует внимания"
              grid: { w: 4 }
              linked_operations: [OP-FIN-11, OP-FIN-13]

        - id: "sec-analytics-arap"
          type: "analytics"
          title: "Аналитика задолженности"
          widgets:
            - widget_id: W02-04
              type: Chart
              title: "Счета по статусам"
              subtitle: "распределение"
              dataSource: "Q-FIN-02-04"
              chartType: "pie"
              category: "status_id"
              showLegend: true
              height: 320
              leftAxis:
                format: "number"
              series:
                - field: "invoice_count"
                  label: "Количество счетов"
              grid: { w: 4 }
              linked_operations: [OP-FIN-11, OP-FIN-13, OP-FIN-14]

        - id: "sec-alerts-arap"
          type: "alerts"
          title: "Просроченные счета"
          widgets:
            - widget_id: W02-03
              type: Table
              title: "Просроченные счета"
              subtitle: "требуют оплаты"
              dataSource: "Q-FIN-02-03"
              pageSize: 10
              enableSearch: true
              enableExport: true
              columns:
                - field: "invoice_id"
                  title: "ID"
                  width: 80
                  align: "center"
                - field: "invoice_type"
                  title: "Тип"
                  width: 100
                  widget:
                    type: "status"
                    statusMap:
                      "AR": "info"
                      "AP": "warning"
                - field: "counterparty_id"
                  title: "ID контрагента"
                  width: 120
                  align: "center"
                - field: "invoice_number"
                  title: "№ счета"
                  width: 140
                  sortable: true
                - field: "due_date"
                  title: "Срок оплаты"
                  width: 120
                  formatter: "date"
                  sortable: true
                - field: "amount"
                  title: "Сумма"
                  width: 150
                  align: "right"
                  formatter: "currency"
                  summary: "SUM"
                - field: "status_id"
                  title: "Статус"
                  width: 120
                  widget:
                    type: "status"
                    statusMap:
                      "issued": "warning"
                      "partially_paid": "info"
                      "overdue": "danger"
              grid: { w: 8 }
              linked_operations: [OP-FIN-13]


