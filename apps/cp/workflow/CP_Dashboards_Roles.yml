                  formatter: "date"
                - field: "contract_type"
                  title: "Тип"
                  width: 120
                - field: "amount"
                  title: "Сумма"
                  width: 130
                  align: "right"
                  formatter: "currency"
                - field: "status_id"
                  title: "Статус"
                  width: 120
